# Realtime Chat 2.0.0-dev.1. Ambiente LOCAL de desenvolvimento.
server.port=${PORT:8081}
spring.application.name=realtime-chat
logging.level.com.example.chat=INFO
# Nao ativar indiscriminadamente em ambientes publicos.
chat.allowed-origins=${CHAT_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost,http://127.0.0.1}

# H2 em disco = iniciar com mvn spring-boot:run sem configurar banco.
# Para PostgreSQL, defina SPRING_DATASOURCE_* ou use docker compose.
spring.datasource.url=${DB_URL:jdbc:h2:file:./realtimechat-dev;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.sql.init.mode=always
server.error.include-message=never
