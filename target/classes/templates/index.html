<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Time Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Colors */
            --primary: #6366f1;
            --primary-hover: #5b5af5;
            --primary-light: #a5b4fc;
            --secondary: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;

            /* Light theme */
            --bg-light: #f8fafc;
            --bg-card-light: #ffffff;
            --text-light: #1e293b;
            --text-muted-light: #64748b;
            --border-light: #e2e8f0;
            --shadow-light: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);

            /* Dark theme */
            --bg-dark: #0f172a;
            --bg-card-dark: #1e293b;
            --text-dark: #f1f5f9;
            --text-muted-dark: #94a3b8;
            --border-dark: #334155;
            --shadow-dark: 0 4px 6px -1px rgb(0 0 0 / 0.3), 0 2px 4px -2px rgb(0 0 0 / 0.3);
        }

        [data-theme="light"] {
            --bg: var(--bg-light);
            --bg-card: var(--bg-card-light);
            --text: var(--text-light);
            --text-muted: var(--text-muted-light);
            --border: var(--border-light);
            --shadow: var(--shadow-light);
        }

        [data-theme="dark"] {
            --bg: var(--bg-dark);
            --bg-card: var(--bg-card-dark);
            --text: var(--text-dark);
            --text-muted: var(--text-muted-dark);
            --border: var(--border-dark);
            --shadow: var(--shadow-dark);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            line-height: 1.6;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            height: 100vh;
            display: grid;
            grid-template-areas:
                "header header header"
                "sidebar chat chat"
                "sidebar input input";
            grid-template-columns: 300px 1fr;
            grid-template-rows: 60px 1fr auto;
            gap: 0;
        }

        @media (max-width: 768px) {
            .app-container {
                grid-template-areas:
                    "header"
                    "chat"
                    "input";
                grid-template-columns: 1fr;
                grid-template-rows: 60px 1fr auto;
            }

            .sidebar {
                position: fixed;
                left: -320px;
                top: 60px;
                height: calc(100vh - 60px);
                width: 320px;
                z-index: 1000;
                transition: left 0.3s ease;
                border-right: 1px solid var(--border);
                background: var(--bg-card);
            }

            .sidebar.open {
                left: 0;
            }

            .overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.5);
                z-index: 999;
                display: none;
            }

            .overlay.active {
                display: block;
            }
        }

        /* Header */
        .header {
            grid-area: header;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            z-index: 100;
        }

        .brand {
            font-weight: 700;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--primary);
        }

        .brand i {
            font-size: 1.5rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.connected { background: var(--success); }
        .status-dot.connecting { background: var(--warning); }
        .status-dot.disconnected { background: var(--danger); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 1.1rem;
        }

        .icon-btn:hover {
            background: var(--primary);
            color: white;
            transform: scale(1.05);
        }

        .mobile-only {
            display: none;
        }

        @media (max-width: 768px) {
            .mobile-only {
                display: flex;
            }
        }

        /* Sidebar */
        .sidebar {
            grid-area: sidebar;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .users-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .section-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            background: var(--bg);
        }

        .user-count {
            background: var(--primary);
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .users-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .user-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .user-item:hover {
            background: var(--bg);
            border-left-color: var(--primary);
        }

        .user-item.me {
            background: var(--primary-light);
            background-opacity: 0.1;
            border-left-color: var(--primary);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
            font-size: 0.875rem;
            position: relative;
            overflow: hidden;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-status-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--bg-card);
        }

        .user-status-dot.online { background: var(--success); }
        .user-status-dot.away { background: var(--warning); }
        .user-status-dot.busy { background: var(--danger); }
        .user-status-dot.offline { background: var(--secondary); }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-weight: 500;
            font-size: 0.875rem;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-status {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .user-typing {
            color: var(--primary);
            font-style: italic;
        }

        /* Chat Area */
        .chat-container {
            grid-area: chat;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 40px;
            background: var(--bg-card);
        }

        .welcome-screen h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-screen p {
            color: var(--text-muted);
            font-size: 1.125rem;
            margin-bottom: 32px;
            max-width: 400px;
        }

        .username-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 320px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        .form-label {
            font-weight: 500;
            color: var(--text);
        }

        .form-input {
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn:disabled {
            background: var(--secondary);
            cursor: not-allowed;
            transform: none;
        }

        /* Messages */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message-group.own {
            align-items: flex-end;
        }

        .message-group.other {
            align-items: flex-start;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .message-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            overflow: hidden;
        }

        .message-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
            word-wrap: break-word;
            animation: messageAppear 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-bubble.own {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .message-bubble.other {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-bottom-left-radius: 6px;
        }

        .message-bubble.system {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            text-align: center;
            font-style: italic;
            font-size: 0.875rem;
            max-width: 80%;
            align-self: center;
            border-radius: 20px;
        }

        .message-bubble.error {
            background: var(--danger);
            color: white;
            align-self: center;
        }

        .message-bubble.private {
            border-left: 3px solid var(--warning);
        }

        .message-content {
            line-height: 1.5;
        }

        .message-time {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-top: 4px;
        }

        .mention {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            padding: 2px 4px;
            border-radius: 4px;
            font-weight: 500;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.875rem;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: typingAnimation 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typingAnimation {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Input Area */
        .input-container {
            grid-area: input;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: 20px;
        }

        .message-form {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            max-width: 100%;
        }

        .message-input-wrapper {
            flex: 1;
            position: relative;
        }

        .message-input {
            width: 100%;
            min-height: 48px;
            max-height: 120px;
            padding: 12px 50px 12px 16px;
            border: 2px solid var(--border);
            border-radius: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            line-height: 1.5;
            resize: none;
            transition: all 0.2s;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .message-input::placeholder {
            color: var(--text-muted);
        }

        .input-actions {
            position: absolute;
            right: 8px;
            bottom: 8px;
            display: flex;
            gap: 4px;
        }

        .input-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .input-btn:hover {
            background: var(--bg);
            color: var(--primary);
            transform: scale(1.1);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: scale(1.05);
        }

        .send-btn:disabled {
            background: var(--secondary);
            cursor: not-allowed;
            transform: none;
        }

        /* Emoji Picker */
        .emoji-picker {
            position: absolute;
            bottom: 100%;
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow);
            z-index: 1000;
            display: none;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            max-width: 280px;
        }

        .emoji-picker.active {
            display: grid;
        }

        .emoji-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 4px;
            font-size: 1.2rem;
            transition: all 0.2s;
        }

        .emoji-btn:hover {
            background: var(--bg);
            transform: scale(1.2);
        }

        /* Notifications */
        .notifications {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .notification {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 300px;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success { border-left: 4px solid var(--success); }
        .notification.error { border-left: 4px solid var(--danger); }
        .notification.info { border-left: 4px solid var(--info); }
        .notification.warning { border-left: 4px solid var(--warning); }

        .notification-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.875rem;
        }

        .notification.success .notification-icon { background: var(--success); }
        .notification.error .notification-icon { background: var(--danger); }
        .notification.info .notification-icon { background: var(--info); }
        .notification.warning .notification-icon { background: var(--warning); }

        .notification-content {
            flex: 1;
        }

        .notification-title {
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 2px;
        }

        .notification-message {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .notification-close {
            width: 24px;
            height: 24px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .notification-close:hover {
            background: var(--bg);
            color: var(--text);
        }

        /* Scroll to bottom button */
        .scroll-to-bottom {
            position: fixed;
            bottom: 120px;
            right: 30px;
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            z-index: 100;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1.1rem;
        }

        .scroll-to-bottom.visible {
            opacity: 1;
            transform: scale(1);
        }

        .scroll-to-bottom:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }

        /* Scrollbar styles */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 2px solid white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Hidden class */
        .hidden {
            display: none !important;
        }

        /* Fade animations */
        .fade-enter {
            opacity: 0;
            transform: translateY(10px);
        }

        .fade-enter-active {
            opacity: 1;
            transform: translateY(0);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fade-exit {
            opacity: 1;
            transform: translateY(0);
        }

        .fade-exit-active {
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body data-theme="dark">
<!-- Overlay for mobile sidebar -->
<div class="overlay" id="overlay"></div>

<!-- Notifications container -->
<div class="notifications" id="notifications"></div>

<!-- Main app container -->
<div class="app-container">
    <!-- Header -->
    <header class="header">
        <div class="brand">
            <i class="fas fa-comments"></i>
            <span>Real Time Chat</span>
        </div>

        <div class="header-actions">
            <div class="status-indicator">
                <div class="status-dot disconnected" id="statusDot"></div>
                <span id="statusText">Desconectado</span>
            </div>

            <button class="icon-btn" id="themeToggle" title="Alternar tema">
                <i class="fas fa-moon"></i>
            </button>

            <button class="icon-btn mobile-only" id="sidebarToggle" title="Usuários online">
                <i class="fas fa-users"></i>
            </button>
        </div>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="users-section">
            <div class="section-header">
                <span>Usuários Online</span>
                <span class="user-count" id="userCount">0</span>
            </div>
            <div class="users-list" id="usersList"></div>
        </div>
    </aside>

    <!-- Main chat area -->
    <main class="chat-container">
        <!-- Welcome screen -->
        <div class="welcome-screen" id="welcomeScreen">
            <h2>Bem-vindo ao Real Time Chat</h2>
            <p>Entre no chat e comece a conversar em tempo real!</p>

            <form class="username-form" id="usernameForm">
                <div class="form-group">
                    <label class="form-label" for="usernameInput">Escolha seu nome de usuário</label>
                    <input
                            type="text"
                            id="usernameInput"
                            class="form-input"
                            placeholder="Digite seu nome..."
                            autocomplete="off"
                            required
                            maxlength="30"
                            pattern="[a-zA-Z0-9_-]+"
                            title="Apenas letras, números, _ e -"
                    />
                </div>
                <button type="submit" class="btn" id="joinBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    Entrar no Chat
                </button>
            </form>
        </div>

        <!-- Messages container -->
        <div class="messages-container hidden" id="messagesContainer"></div>

        <!-- Typing indicator -->
        <div class="typing-indicator hidden" id="typingIndicator">
            <div class="typing-dots">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
            <span id="typingText"></span>
        </div>
    </main>

    <!-- Input area -->
    <div class="input-container hidden" id="inputContainer">
        <form class="message-form" id="messageForm">
            <div class="message-input-wrapper">
                    <textarea
                            id="messageInput"
                            class="message-input"
                            placeholder="Digite sua mensagem..."
                            autocomplete="off"
                            maxlength="1000"
                            rows="1"
                    ></textarea>

                <div class="input-actions">
                    <button type="button" class="input-btn" id="emojiBtn" title="Emojis">
                        <i class="fas fa-smile"></i>
                    </button>
                </div>

                <!-- Emoji picker -->
                <div class="emoji-picker" id="emojiPicker">
                    <button type="button" class="emoji-btn" data-emoji="😀">😀</button>
                    <button type="button" class="emoji-btn" data-emoji="😂">😂</button>
                    <button type="button" class="emoji-btn" data-emoji="😍">😍</button>
                    <button type="button" class="emoji-btn" data-emoji="🤔">🤔</button>
                    <button type="button" class="emoji-btn" data-emoji="😎">😎</button>
                    <button type="button" class="emoji-btn" data-emoji="😢">😢</button>
                    <button type="button" class="emoji-btn" data-emoji="😡">😡</button>
                    <button type="button" class="emoji-btn" data-emoji="😴">😴</button>
                    <button type="button" class="emoji-btn" data-emoji="🎉">🎉</button>
                    <button type="button" class="emoji-btn" data-emoji="❤️">❤️</button>
                    <button type="button" class="emoji-btn" data-emoji="👍">👍</button>
                    <button type="button" class="emoji-btn" data-emoji="👎">👎</button>
                    <button type="button" class="emoji-btn" data-emoji="🔥">🔥</button>
                    <button type="button" class="emoji-btn" data-emoji="💯">💯</button>
                    <button type="button" class="emoji-btn" data-emoji="🚀">🚀</button>
                    <button type="button" class="emoji-btn" data-emoji="⚡">⚡</button>
                </div>
            </div>

            <button type="submit" class="send-btn" id="sendBtn" title="Enviar mensagem">
                <i class="fas fa-paper-plane"></i>
            </button>
        </form>
    </div>
</div>

<!-- Scroll to bottom button -->
<button class="scroll-to-bottom" id="scrollToBottomBtn" title="Ir para o final">
    <i class="fas fa-chevron-down"></i>
</button>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
    // Main Chat Application
    class ChatApp {
        constructor() {
            this.stompClient = null;
            this.username = null;
            this.connected = false;
            this.users = new Map();
            this.typingTimeout = null;
            this.reconnectInterval = null;
            this.messageHistory = [];

            this.elements = {
                welcomeScreen: document.getElementById('welcomeScreen'),
                messagesContainer: document.getElementById('messagesContainer'),
                inputContainer: document.getElementById('inputContainer'),
                usernameForm: document.getElementById('usernameForm'),
                usernameInput: document.getElementById('usernameInput'),
                joinBtn: document.getElementById('joinBtn'),
                messageForm: document.getElementById('messageForm'),
                messageInput: document.getElementById('messageInput'),
                sendBtn: document.getElementById('sendBtn'),
                usersList: document.getElementById('usersList'),
                userCount: document.getElementById('userCount'),
                statusDot: document.getElementById('statusDot'),
                statusText: document.getElementById('statusText'),
                typingIndicator: document.getElementById('typingIndicator'),
                typingText: document.getElementById('typingText'),
                themeToggle: document.getElementById('themeToggle'),
                sidebarToggle: document.getElementById('sidebarToggle'),
                sidebar: document.getElementById('sidebar'),
                overlay: document.getElementById('overlay'),
                emojiBtn: document.getElementById('emojiBtn'),
                emojiPicker: document.getElementById('emojiPicker'),
                scrollToBottomBtn: document.getElementById('scrollToBottomBtn'),
                notifications: document.getElementById('notifications')
            };

            this.init();
        }

        init() {
            this.setupEventListeners();
            this.loadTheme();
            this.adjustTextareaHeight();
        }

        setupEventListeners() {
            // Form submissions
            this.elements.usernameForm.addEventListener('submit', (e) => this.handleUsernameSubmit(e));
            this.elements.messageForm.addEventListener('submit', (e) => this.handleMessageSubmit(e));

            // Input events
            this.elements.messageInput.addEventListener('input', () => {
                this.adjustTextareaHeight();
                this.handleTyping();
            });

            this.elements.messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    this.handleMessageSubmit(e);
                }
            });

            // UI controls
            this.elements.themeToggle.addEventListener('click', () => this.toggleTheme());
            this.elements.sidebarToggle.addEventListener('click', () => this.toggleSidebar());
            this.elements.overlay.addEventListener('click', () => this.closeSidebar());
            this.elements.emojiBtn.addEventListener('click', () => this.toggleEmojiPicker());
            this.elements.scrollToBottomBtn.addEventListener('click', () => this.scrollToBottom());

            // Emoji picker
            this.elements.emojiPicker.addEventListener('click', (e) => {
                if (e.target.classList.contains('emoji-btn')) {
                    this.insertEmoji(e.target.dataset.emoji);
                }
            });

            // Messages container scroll
            this.elements.messagesContainer.addEventListener('scroll', () => this.handleScroll());

            // Click outside to close emoji picker
            document.addEventListener('click', (e) => {
                if (!this.elements.emojiPicker.contains(e.target) && !this.elements.emojiBtn.contains(e.target)) {
                    this.elements.emojiPicker.classList.remove('active');
                }
            });

            // Window events
            window.addEventListener('beforeunload', () => this.disconnect());
            window.addEventListener('focus', () => this.handleWindowFocus());
        }

        handleUsernameSubmit(e) {
            e.preventDefault();

            const username = this.elements.usernameInput.value.trim();
            if (!username) {
                this.showNotification('Por favor, digite um nome de usuário', 'warning');
                return;
            }

            if (username.length > 30) {
                this.showNotification('Nome muito longo (máximo 30 caracteres)', 'warning');
                return;
            }

            if (!/^[a-zA-Z0-9_-]+$/.test(username)) {
                this.showNotification('Use apenas letras, números, _ e -', 'warning');
                return;
            }

            this.username = username;
            this.elements.joinBtn.disabled = true;
            this.elements.joinBtn.innerHTML = '<div class="loading"></div> Conectando...';

            this.connect();
        }

        handleMessageSubmit(e) {
            e.preventDefault();

            const content = this.elements.messageInput.value.trim();
            if (!content || !this.connected) return;

            const message = {
                type: 'CHAT',
                content: content,
                sender: this.username
            };

            this.stompClient.send('/app/chat.send', {}, JSON.stringify(message));
            this.elements.messageInput.value = '';
            this.adjustTextareaHeight();
            this.elements.sendBtn.disabled = false;
        }

        connect() {
            this.updateConnectionStatus('connecting');

            const socket = new SockJS('/ws');
            this.stompClient = Stomp.over(socket);

            // Disable console logs from STOMP
            this.stompClient.debug = null;

            this.stompClient.connect({},
                () => this.onConnected(),
                (error) => this.onError(error)
            );
        }

        onConnected() {
            this.connected = true;
            this.updateConnectionStatus('connected');

            // Subscribe to topics
            this.stompClient.subscribe('/topic/public', (message) => this.onMessageReceived(message));
            this.stompClient.subscribe('/topic/users', (message) => this.onUsersUpdated(message));
            this.stompClient.subscribe('/topic/typing', (message) => this.onTypingReceived(message));
            this.stompClient.subscribe('/user/queue/private', (message) => this.onPrivateMessageReceived(message));
            this.stompClient.subscribe('/user/queue/mention', (message) => this.onMentionReceived(message));
            this.stompClient.subscribe('/user/queue/history', (message) => this.onHistoryReceived(message));

            // Add user to chat
            const joinMessage = {
                type: 'JOIN',
                sender: this.username
            };

            this.stompClient.send('/app/chat.addUser', {}, JSON.stringify(joinMessage));

            // Switch to chat interface
            this.elements.welcomeScreen.classList.add('hidden');
            this.elements.messagesContainer.classList.remove('hidden');
            this.elements.inputContainer.classList.remove('hidden');

            this.elements.messageInput.focus();
            this.showNotification('Conectado com sucesso!', 'success');

            // Clear reconnection interval
            if (this.reconnectInterval) {
                clearInterval(this.reconnectInterval);
                this.reconnectInterval = null;
            }
        }

        onError(error) {
            console.error('Connection error:', error);
            this.connected = false;
            this.updateConnectionStatus('disconnected');

            this.elements.joinBtn.disabled = false;
            this.elements.joinBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Entrar no Chat';

            this.showNotification('Erro de conexão. Tentando reconectar...', 'error');

            // Auto reconnect
            if (!this.reconnectInterval) {
                this.reconnectInterval = setInterval(() => {
                    if (this.username && !this.connected) {
                        this.connect();
                    }
                }, 5000);
            }
        }

        onMessageReceived(payload) {
            const message = JSON.parse(payload.body);
            this.processMessage(message);
        }

        onUsersUpdated(payload) {
            const users = JSON.parse(payload.body);
            this.updateUsersList(users);
        }

        onTypingReceived(payload) {
            const message = JSON.parse(payload.body);
            if (message.sender !== this.username) {
                this.showTypingIndicator(message.sender);
            }
        }

        onPrivateMessageReceived(payload) {
            const message = JSON.parse(payload.body);
            this.processMessage(message, true);
        }

        onMentionReceived(payload) {
            const message = JSON.parse(payload.body);
            this.showNotification(`${message.sender} mencionou você`, 'info');
        }

        onHistoryReceived(payload) {
            const messages = JSON.parse(payload.body);
            messages.forEach(message => this.processMessage(message, false, false));
            this.scrollToBottom();
        }

        processMessage(message, isPrivate = false, animate = true) {
            if (message.type === 'ERROR') {
                this.showNotification(message.content, 'error');

                if (message.content.includes('já está em uso')) {
                    this.disconnect();
                    this.elements.welcomeScreen.classList.remove('hidden');
                    this.elements.messagesContainer.classList.add('hidden');
                    this.elements.inputContainer.classList.add('hidden');
                    this.elements.usernameInput.focus();
                }
                return;
            }

            // Update user count for join/leave messages
            if (message.onlineCount !== undefined) {
                this.elements.userCount.textContent = message.onlineCount;
            }

            this.addMessage(message, isPrivate, animate);
        }

        addMessage(message, isPrivate = false, animate = true) {
            const messageElement = this.createMessageElement(message, isPrivate);

            if (animate) {
                messageElement.classList.add('fade-enter');
                this.elements.messagesContainer.appendChild(messageElement);

                requestAnimationFrame(() => {
                    messageElement.classList.remove('fade-enter');
                    messageElement.classList.add('fade-enter-active');
                });
            } else {
                this.elements.messagesContainer.appendChild(messageElement);
            }

            // Auto scroll if near bottom
            if (this.isNearBottom() || message.sender === this.username) {
                setTimeout(() => this.scrollToBottom(), 100);
            } else {
                this.showScrollButton();
            }

            this.messageHistory.push(message);
        }

        createMessageElement(message, isPrivate = false) {
            const messageGroup = document.createElement('div');
            messageGroup.className = 'message-group';

            const isOwn = message.sender === this.username;
            const isSystem = ['JOIN', 'LEAVE', 'SYSTEM_ANNOUNCEMENT'].includes(message.type);

            if (isOwn) {
                messageGroup.classList.add('own');
            } else {
                messageGroup.classList.add('other');
            }

            // Message header (for non-system messages)
            if (!isSystem && !isOwn) {
                const header = document.createElement('div');
                header.className = 'message-header';

                if (message.avatar) {
                    const avatar = document.createElement('div');
                    avatar.className = 'message-avatar';
                    avatar.innerHTML = `<img src="${message.avatar}" alt="${message.sender}">`;
                    header.appendChild(avatar);
                }

                const senderName = document.createElement('span');
                senderName.textContent = message.sender;
                senderName.style.color = message.color || '#6366f1';
                header.appendChild(senderName);

                if (message.formattedTime) {
                    const time = document.createElement('span');
                    time.textContent = message.formattedTime;
                    header.appendChild(time);
                }

                messageGroup.appendChild(header);
            }

            // Message bubble
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            if (isOwn) {
                bubble.classList.add('own');
            } else if (isSystem) {
                bubble.classList.add('system');
            } else {
                bubble.classList.add('other');
            }

            if (message.type === 'ERROR') {
                bubble.classList.add('error');
            }

            if (isPrivate) {
                bubble.classList.add('private');
            }

            // Message content
            const content = document.createElement('div');
            content.className = 'message-content';

            let messageText = message.content || '';

            // Process mentions
            if (message.mentions && message.mentions.length > 0) {
                message.mentions.forEach(mention => {
                    const regex = new RegExp(`@${mention}`, 'gi');
                    messageText = messageText.replace(regex, `<span class="mention">@${mention}</span>`);
                });
            }

            content.innerHTML = messageText;
            bubble.appendChild(content);

            // Message time (for own messages)
            if (isOwn && message.formattedTime) {
                const time = document.createElement('div');
                time.className = 'message-time';
                time.textContent = message.formattedTime;
                bubble.appendChild(time);
            }

            messageGroup.appendChild(bubble);
            return messageGroup;
        }

        updateUsersList(users) {
            this.elements.usersList.innerHTML = '';
            this.users.clear();

            users.forEach(user => {
                this.users.set(user.username, user);

                const userItem = document.createElement('div');
                userItem.className = 'user-item';

                if (user.username === this.username) {
                    userItem.classList.add('me');
                }

                const avatar = document.createElement('div');
                avatar.className = 'user-avatar';
                avatar.style.backgroundColor = user.color || '#6366f1';

                if (user.avatar) {
                    avatar.innerHTML = `<img src="${user.avatar}" alt="${user.username}">`;
                } else {
                    avatar.textContent = user.username.charAt(0).toUpperCase();
                }

                const statusDot = document.createElement('div');
                statusDot.className = `user-status-dot ${(user.status || 'online').toLowerCase()}`;
                avatar.appendChild(statusDot);

                const userInfo = document.createElement('div');
                userInfo.className = 'user-info';

                const userName = document.createElement('div');
                userName.className = 'user-name';
                userName.textContent = user.username;

                const userStatus = document.createElement('div');
                userStatus.className = 'user-status';

                if (user.typing) {
                    userStatus.textContent = 'Digitando...';
                    userStatus.classList.add('user-typing');
                } else {
                    userStatus.textContent = this.getStatusText(user.status || 'online');
                }

                userInfo.appendChild(userName);
                userInfo.appendChild(userStatus);

                userItem.appendChild(avatar);
                userItem.appendChild(userInfo);

                this.elements.usersList.appendChild(userItem);
            });

            this.elements.userCount.textContent = users.length;
        }

        getStatusText(status) {
            const statusMap = {
                'online': 'Online',
                'away': 'Ausente',
                'busy': 'Ocupado',
                'offline': 'Offline'
            };
            return statusMap[status.toLowerCase()] || 'Online';
        }

        showTypingIndicator(username) {
            this.elements.typingText.textContent = `${username} está digitando...`;
            this.elements.typingIndicator.classList.remove('hidden');

            // Clear existing timeout
            if (this.typingTimeout) {
                clearTimeout(this.typingTimeout);
            }

            // Hide after 3 seconds
            this.typingTimeout = setTimeout(() => {
                this.elements.typingIndicator.classList.add('hidden');
            }, 3000);
        }

        handleTyping() {
            if (this.connected && this.stompClient) {
                this.stompClient.send('/app/chat.typing', {}, {});
            }
        }

        adjustTextareaHeight() {
            const textarea = this.elements.messageInput;
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }

        toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);

            const icon = this.elements.themeToggle.querySelector('i');
            icon.className = newTheme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
        }

        loadTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.body.setAttribute('data-theme', savedTheme);

            const icon = this.elements.themeToggle.querySelector('i');
            icon.className = savedTheme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
        }

        toggleSidebar() {
            this.elements.sidebar.classList.add('open');
            this.elements.overlay.classList.add('active');
        }

        closeSidebar() {
            this.elements.sidebar.classList.remove('open');
            this.elements.overlay.classList.remove('active');
        }

        toggleEmojiPicker() {
            this.elements.emojiPicker.classList.toggle('active');
        }

        insertEmoji(emoji) {
            const textarea = this.elements.messageInput;
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;

            textarea.value = text.substring(0, start) + emoji + text.substring(end);
            textarea.focus();
            textarea.setSelectionRange(start + emoji.length, start + emoji.length);

            this.elements.emojiPicker.classList.remove('active');
            this.adjustTextareaHeight();
        }

        scrollToBottom() {
            this.elements.messagesContainer.scrollTop = this.elements.messagesContainer.scrollHeight;
            this.hideScrollButton();
        }

        isNearBottom() {
            const container = this.elements.messagesContainer;
            return container.scrollTop + container.clientHeight >= container.scrollHeight - 50;
        }

        showScrollButton() {
            this.elements.scrollToBottomBtn.classList.add('visible');
        }

        hideScrollButton() {
            this.elements.scrollToBottomBtn.classList.remove('visible');
        }

        handleScroll() {
            if (this.isNearBottom()) {
                this.hideScrollButton();
            } else {
                this.showScrollButton();
            }
        }

        handleWindowFocus() {
            if (this.elements.messageInput && !this.elements.inputContainer.classList.contains('hidden')) {
                this.elements.messageInput.focus();
            }
        }

        updateConnectionStatus(status) {
            const statusMap = {
                'connected': { text: 'Conectado', class: 'connected' },
                'connecting': { text: 'Conectando...', class: 'connecting' },
                'disconnected': { text: 'Desconectado', class: 'disconnected' }
            };

            const statusInfo = statusMap[status];
            this.elements.statusText.textContent = statusInfo.text;
            this.elements.statusDot.className = `status-dot ${statusInfo.class}`;
        }

        showNotification(message, type = 'info', duration = 5000) {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;

            const iconMap = {
                'success': 'fas fa-check',
                'error': 'fas fa-exclamation-triangle',
                'warning': 'fas fa-exclamation-circle',
                'info': 'fas fa-info-circle'
            };

            notification.innerHTML = `
                <div class="notification-icon">
                    <i class="${iconMap[type]}"></i>
                </div>
                <div class="notification-content">
                    <div class="notification-message">${message}</div>
                </div>
                <button class="notification-close">
                    <i class="fas fa-times"></i>
                </button>
            `;

            this.elements.notifications.appendChild(notification);

            // Show notification
            requestAnimationFrame(() => {
                notification.classList.add('show');
            });

            // Close button
            notification.querySelector('.notification-close').addEventListener('click', () => {
                this.hideNotification(notification);
            });

            // Auto hide
            setTimeout(() => {
                this.hideNotification(notification);
            }, duration);
        }

        hideNotification(notification) {
            notification.classList.remove('show');
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.parentNode.removeChild(notification);
                }
            }, 300);
        }

        disconnect() {
            if (this.stompClient && this.connected) {
                this.stompClient.disconnect();
            }
            this.connected = false;
            this.updateConnectionStatus('disconnected');
        }
    }

    // Initialize the chat application
    document.addEventListener('DOMContentLoaded', () => {
        new ChatApp();
    });
</script>
</body>
</html>
