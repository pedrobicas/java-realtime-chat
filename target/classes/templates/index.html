<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat em Tempo Real</title>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
        .container { max-width: 900px; margin: 0 auto; padding: 24px; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
        .card header { padding: 16px 20px; border-bottom: 1px solid #1f2937; display: flex; align-items: center; justify-content: space-between; }
        .brand { font-weight: 700; letter-spacing: .3px; }
        .status { font-size: 12px; opacity: .8; }
        #messageArea { height: 420px; overflow-y: auto; padding: 16px 20px; }
        .message { padding: 10px 12px; margin: 8px 0; border-radius: 12px; background: #0b1220; border: 1px solid #1f2937; }
        .message .meta { font-size: 12px; opacity: .7; margin-bottom: 6px; }
        .message.self { background:#0e172a; border-color:#253049; }
        form { display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid #1f2937; }
        input, button { font-size: 16px; }
        input[type=text] { flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid #334155; background:#0b1220; color:#e2e8f0; }
        button { padding: 12px 16px; border-radius: 12px; border: 1px solid #334155; background: #1d4ed8; color: white; cursor: pointer; }
        button:hover { filter: brightness(1.05); }
        .hidden { display:none; }
        #usernamePage { padding: 24px; }
        #usernamePage input { max-width: 340px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <header>
                <div class="brand">💬 Java Realtime Chat</div>
                <div class="status"><span id="connStatus">Desconectado</span></div>
            </header>
            <div id="usernamePage">
                <p>Digite um nome de usuário para entrar no chat:</p>
                <form id="usernameForm">
                    <input type="text" id="name" placeholder="Seu nome" autocomplete="off" required />
                    <button type="submit">Entrar</button>
                </form>
            </div>
            <div id="chatPage" class="hidden">
                <div id="messageArea"></div>
                <form id="messageForm">
                    <input type="text" id="message" placeholder="Digite sua mensagem..." autocomplete="off" required />
                    <button type="submit">Enviar</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script>
        let stompClient = null;
        let username = null;
        const connStatus = document.getElementById('connStatus');
        const messageArea = document.getElementById('messageArea');
        const usernamePage = document.getElementById('usernamePage');
        const chatPage = document.getElementById('chatPage');

        function connect(event) {
            event.preventDefault();
            const nameInput = document.getElementById('name');
            username = nameInput.value.trim();
            if (!username) return;
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.connect({}, onConnected, onError);
        }

        function onConnected() {
            connStatus.textContent = 'Conectado';
            usernamePage.classList.add('hidden');
            chatPage.classList.remove('hidden');

            stompClient.subscribe('/topic/public', onMessageReceived);
            stompClient.send('/app/chat.addUser', {}, JSON.stringify({sender: username, type: 'JOIN'}));
        }

        function onError() {
            connStatus.textContent = 'Erro de conexão';
        }

        function sendMessage(event) {
            event.preventDefault();
            const messageInput = document.getElementById('message');
            const messageContent = messageInput.value.trim();
            if (messageContent && stompClient) {
                const chatMessage = {sender: username, content: messageContent, type: 'CHAT'};
                stompClient.send('/app/chat.send', {}, JSON.stringify(chatMessage));
                messageInput.value = '';
            }
        }

        function onMessageReceived(payload) {
            const message = JSON.parse(payload.body);
            const messageElement = document.createElement('div');
            messageElement.classList.add('message');
            if (message.sender === username) messageElement.classList.add('self');
            const meta = document.createElement('div');
            meta.classList.add('meta');
            meta.textContent = message.type === 'JOIN' ? `${message.sender} entrou` :
                                message.type === 'LEAVE' ? `${message.sender} saiu` :
                                `${message.sender} diz:`;
            const content = document.createElement('div');
            content.textContent = message.content || '';
            messageElement.appendChild(meta);
            if (message.content) messageElement.appendChild(content);
            messageArea.appendChild(messageElement);
            messageArea.scrollTop = messageArea.scrollHeight;
        }

        document.getElementById('usernameForm').addEventListener('submit', connect);
        document.getElementById('messageForm').addEventListener('submit', sendMessage);
    </script>
</body>
</html>
