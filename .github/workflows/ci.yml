name: Backend CI (v2 development)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  maven-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test
      - run: mvn -B package -DskipTests
