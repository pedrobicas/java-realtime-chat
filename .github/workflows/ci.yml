name: Backend CI

on:
  push:
    branches: [main, 'develop/**']
  pull_request:

permissions:
  contents: read

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject unresolved merge conflicts
        run: |
          if git grep -n -I -E '^(<<<<<<< |=======$|>>>>>>> )' -- .; then
            echo "Unresolved merge conflict markers found"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify (compile, tests, package)
        run: mvn -B verify
